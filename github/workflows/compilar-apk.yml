name: Compilar APK Insuasty Motors

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Construir APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Empaquetar pagina para movil
        run: npm run build

      - name: Crear Android y sincronizar
        run: |
          npx cap add android
          npx cap sync android
          node scripts/personalizar-android.mjs

      - name: Compilar APK instalable
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Subir APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Insuasty-Motors-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
